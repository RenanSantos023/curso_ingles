<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Link</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,.15);
            width:500px;
            text-align:center;
        }

        h1{
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:15px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            background:#007BFF;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Enviar Link</h1>

        <input
            type="url"
            id="link"
            placeholder="Cole seu link aqui">

        <button onclick="enviar()">
            Enviar
        </button>
    </div>

    <!-- Importa o JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
