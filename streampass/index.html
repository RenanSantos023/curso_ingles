<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreamPass</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🎬 StreamPass</h1>

            <p class="subtitle">
                Entre na sua conta
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required>

                </div>

                <div class="input-group">

                    <label>Senha</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required>

                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

            <div id="message"></div>

            <div class="links">

                <a href="register.html">
                    Criar Conta
                </a>

                <a href="#">
                    Esqueci minha senha
                </a>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
