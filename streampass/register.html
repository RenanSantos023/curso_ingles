<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - StreamPass</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>📝 Criar Conta</h1>

            <p class="subtitle">
                Preencha os dados abaixo
            </p>

            <form id="registerForm">

                <div class="input-group">

                    <label>Nome</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Seu nome"
                        required>

                </div>

                <div class="input-group">

                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Seu e-mail"
                        required>

                </div>

                <div class="input-group">

                    <label>Senha</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Crie uma senha"
                        required>

                </div>

                <div class="input-group">

                    <label>Confirmar senha</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Digite novamente"
                        required>

                </div>

                <button type="submit">
                    Criar Conta
                </button>

            </form>

            <div id="message"></div>

            <div class="links">

                <a href="index.html">
                    ← Voltar para Login
                </a>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
