<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar Conta - StreamPass</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>📧 Confirmar Conta</h1>

            <p class="subtitle">

                Digite o código enviado para seu e-mail.

            </p>

            <form id="confirmForm">

                <div class="input-group">

                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Seu e-mail"
                        required>

                </div>

                <div class="input-group">

                    <label>Código</label>

                    <input
                        type="text"
                        id="code"
                        placeholder="Ex.: 123456"
                        required>

                </div>

                <button type="submit">

                    Confirmar Conta

                </button>

            </form>

            <div id="message"></div>

            <div class="links">

                <a href="index.html">

                    Voltar para Login

                </a>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
