<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - StreamPass</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="card" style="width:700px;">

            <h1>🎬 StreamPass</h1>

            <p class="subtitle">
                Bem-vindo ao painel
            </p>

            <hr style="margin:25px 0; border:1px solid #334155;">

            <h2 id="userName">
                Olá, Usuário
            </h2>

            <p id="userEmail">
                usuario@email.com
            </p>

            <br>

            <div class="dashboard-grid">

                <div class="dashboard-card">

                    <h3>Plano</h3>

                    <p>Gratuito</p>

                </div>

                <div class="dashboard-card">

                    <h3>Status</h3>

                    <p>Ativo</p>

                </div>

                <div class="dashboard-card">

                    <h3>Último Login</h3>

                    <p>Hoje</p>

                </div>

                <div class="dashboard-card">

                    <h3>Conta</h3>

                    <p>Confirmada</p>

                </div>

            </div>

            <br>

            <button id="logoutButton">

                Sair

            </button>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
